
name: Nightly arm64

on:
  schedule:
    - cron: '17 6 * * *'  # Daily at 06:17 UTC
  workflow_dispatch:

concurrency:
  group: nightly-arm64
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write

    steps:
      - name: Sync upstream main
        run: gh repo sync "$GITHUB_REPOSITORY" --source lklynet/aurral --branch main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - id: version
        name: Generate version
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "value=nightly.${GITHUB_RUN_NUMBER}+${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository }}:nightly
          platforms: linux/arm64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            GITHUB_REPO=${{ github.repository }}
            RELEASE_CHANNEL=nightly
          cache-from: type=gha
          cache-to: type=gha,mode=max
