name: Nightly multi-arch

on:
  schedule:
    - cron: "17 6 * * *" # Daily at 06:17 UTC
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "main"
        type: string

concurrency:
  group: nightly-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write

    outputs:
      branch: ${{ steps.meta.outputs.branch }}
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      created: ${{ steps.meta.outputs.created }}
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Resolve branch
        id: branch
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            BRANCH="$INPUT_BRANCH"
          else
            BRANCH="main"
          fi

          if [[ -z "$BRANCH" ]]; then
            echo "::error::Branch cannot be empty"
            exit 1
          fi

          echo "value=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Sync upstream main
        if: steps.branch.outputs.value == 'main'
        run: gh repo sync "$GITHUB_REPOSITORY" --source lklynet/aurral --branch main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.branch.outputs.value }}

      - name: Generate metadata
        id: meta
        env:
          BRANCH: ${{ steps.branch.outputs.value }}
        run: |
          SHA=$(git rev-parse HEAD)

          # Sanitize branch name for use in versions and Docker tags.
          SAFE_BRANCH=$(echo "$BRANCH" | sed 's#[^a-zA-Z0-9_.-]#-#g')

          if [[ "$BRANCH" == "main" ]]; then
            TAG="nightly"
          else
            TAG="nightly-${SAFE_BRANCH}"
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=nightly.${SAFE_BRANCH}.${GITHUB_RUN_NUMBER}+${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build image (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          provenance: mode=max
          sbom: true
          platforms: ${{ matrix.platform }}

          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true

          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/lklynet/aurral
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            org.opencontainers.image.title=Aurral
            org.opencontainers.image.description=Aurral fork - self-hosted music streaming server
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.created }}

          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
            GITHUB_REPO=${{ github.repository }}
            RELEASE_CHANNEL=nightly

          cache-from: type=gha,scope=nightly-buildkit-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=nightly-buildkit-${{ matrix.arch }}

      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid build digest: $DIGEST"
            exit 1
          fi

          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    permissions:
      packages: write

    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      TAG: ${{ needs.prepare.outputs.tag }}
      REPO: ${{ github.repository }}
      SHA: ${{ needs.prepare.outputs.sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
      CREATED: ${{ needs.prepare.outputs.created }}

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail

          mapfile -t DIGEST_FILES < <(
            find . -maxdepth 1 -type f -printf '%f\n' | sort
          )

          if [[ ${#DIGEST_FILES[@]} -ne 2 ]]; then
            echo "::error::Expected exactly two architecture digests, found ${#DIGEST_FILES[@]}"
            exit 1
          fi

          for DIGEST in "${DIGEST_FILES[@]}"; do
            if [[ ! "$DIGEST" =~ ^[a-f0-9]{64}$ ]]; then
              echo "::error::Invalid image digest: $DIGEST"
              exit 1
            fi
          done

          SOURCES=()
          for DIGEST in "${DIGEST_FILES[@]}"; do
            SOURCES+=("${IMAGE}@sha256:${DIGEST}")
          done

          docker buildx imagetools create \
            --tag "$IMAGE:$TAG" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${REPO}" \
            --annotation "index:org.opencontainers.image.url=https://github.com/lklynet/aurral" \
            --annotation "index:org.opencontainers.image.documentation=https://github.com/${REPO}#readme" \
            --annotation "index:org.opencontainers.image.title=Aurral" \
            --annotation "index:org.opencontainers.image.description=Aurral fork - self-hosted music streaming server" \
            --annotation "index:org.opencontainers.image.licenses=AGPL-3.0" \
            --annotation "index:org.opencontainers.image.revision=${SHA}" \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            --annotation "index:org.opencontainers.image.created=${CREATED}" \
            "${SOURCES[@]}"

          docker buildx imagetools inspect "$IMAGE:$TAG"
